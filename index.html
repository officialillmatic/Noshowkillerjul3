    <!-- ============ STRUCTURED DATA (Schema.org JSON-LD) ============ -->
    <!-- Machine-readable description of the business. Lives in raw HTML, so
         AI crawlers and Google can read it even before client-side JS runs. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://www.noshowkillerai.com/#organization",
          "name": "No Show Killer AI",
          "url": "https://www.noshowkillerai.com/",
          "logo": "https://www.noshowkillerai.com/og-image.png",
          "description": "No Show Killer AI provides white-label AI voice receptionists that answer calls 24/7, book appointments, and reduce no-shows for local businesses across the United States."
        },
        {
          "@type": "WebSite",
          "@id": "https://www.noshowkillerai.com/#website",
          "url": "https://www.noshowkillerai.com/",
          "name": "No Show Killer AI",
          "publisher": { "@id": "https://www.noshowkillerai.com/#organization" },
          "inLanguage": "en-US"
        },
        {
          "@type": "SoftwareApplication",
          "name": "No Show Killer AI",
          "applicationCategory": "BusinessApplication",
          "operatingSystem": "Web",
          "url": "https://www.noshowkillerai.com/",
          "description": "AI voice receptionist software for local businesses. Answers every call 24/7, qualifies leads, books appointments directly into your calendar, and sends reminders that reduce no-shows.",
          "offers": {
            "@type": "Offer",
            "price": "497",
            "priceCurrency": "USD"
          },
          "provider": { "@id": "https://www.noshowkillerai.com/#organization" }
        },
        {
          "@type": "FAQPage",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "We already have a receptionist. Why would we need this?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "She keeps her job and loses the worst part of it. Ava covers after hours, lunch, weekends and the second line that rings while your receptionist is with a patient. Nothing goes to voicemail."
              }
            },
            {
              "@type": "Question",
              "name": "Will patients know they are talking to an AI?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Ava introduces herself by name, sounds natural and answers in your practice's voice. If a caller asks for a person, she transfers the call or takes a message for a call-back."
              }
            },
            {
              "@type": "Question",
              "name": "Does it work with my calendar and practice software?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Ava books into the calendar you already use. During setup we connect your scheduling system, load your services, hours and booking rules, and test real bookings before she goes live."
              }
            },
            {
              "@type": "Question",
              "name": "How does No Show Killer AI reduce no-shows?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Every booking gets a text confirmation, a reminder before the visit and an easy way to reschedule by replying. Patients who would have silently skipped either confirm or free the slot in time to refill it."
              }
            },
            {
              "@type": "Question",
              "name": "How long does setup take?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Most practices are live within days. We build and train Ava on your practice, you review a test call, and we switch her on. You keep your phone number."
              }
            },
            {
              "@type": "Question",
              "name": "What does No Show Killer AI cost?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Plans start at $497 a month with 500 call minutes and go up to $1,997 for 4,000 minutes. Setup is quoted after the demo. Plans are monthly and cancelled in one click from your portal."
              }
            }
          ]
        }
      ]
    }
